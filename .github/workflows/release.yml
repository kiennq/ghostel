name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest release
        continue-on-error: true
        id: cur_release
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: ${{ github.repository }}
          excludes: draft

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          base_ver="$(grep -Po '^;; Version: \K[\d.]+' lisp/ghostel.el)"
          sha="${GITHUB_SHA::6}"
          should_release=true

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            latest_tag=$([[ "${{ steps.cur_release.outcome }}" == "failure" ]] && echo "" || echo "${{ steps.cur_release.outputs.release }}")
            if [[ -n "$latest_tag" ]] && git rev-parse -q --verify "refs/tags/$latest_tag" >/dev/null; then
              if git diff --quiet "$latest_tag"...HEAD -- \
                lisp/ghostel.el \
                build.zig \
                build.zig.zon \
                .github/workflows/release.yml \
                .github/workflows/ci.yml \
                vendor \
                src
              then
                should_release=false
              fi
            fi
            version="${base_ver}.${GITHUB_RUN_NUMBER}.${sha}"
            tag="v${version}"
          fi

          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.version.outputs.should_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: x86_64-linux
            suffix: .so
            target: x86_64-linux-gnu.2.35
          - os: macos-26
            platform: aarch64-macos
            suffix: .dylib
          - os: macos-26
            platform: x86_64-macos
            suffix: .dylib
            target: x86_64-macos
          - os: ubuntu-latest
            platform: aarch64-linux
            suffix: .so
            target: aarch64-linux-gnu.2.35
          - os: ubuntu-latest
            platform: x86_64-freebsd
            suffix: .so
            target: x86_64-freebsd
          # Termux (bionic).  The runner image ships an Android SDK, and
          # build.zig locates its NDK through ANDROID_HOME.
          # API 24 is Termux's minimum.
          - os: ubuntu-latest
            platform: aarch64-android
            suffix: .so
            target: aarch64-linux-android.24
          - os: windows-latest
            platform: x86_64-windows
            suffix: .dll
            target: x86_64-windows-gnu
          - os: windows-latest
            platform: aarch64-windows
            suffix: .dll
            target: aarch64-windows-gnu
    runs-on: ${{ matrix.os }}
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Zig build state
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ZIG_GLOBAL_CACHE_DIR }}
            ${{ env.ZIG_LOCAL_CACHE_DIR }}
          key: release-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'vendor/**', '.github/workflows/release.yml') }}
          restore-keys: |
            release-${{ runner.os }}-${{ matrix.platform }}-

      - name: Select Xcode 26.3 for Zig 0.16.0
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: ${{ matrix.platform }}-zig-0.16.0

      - name: Download ConPTY runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.nuget.org/api/v2/package/Microsoft.Windows.Console.ConPTY/1.24.260512001 -OutFile conpty.zip
          Expand-Archive -LiteralPath conpty.zip -DestinationPath conpty-package -Force

      - name: Build native module
        shell: bash
        run: |
          set -euo pipefail
          build_args=(-Doptimize=ReleaseFast -Dcpu=baseline)
          if [ "${{ runner.os }}" = "Windows" ]; then
            build_args+=(-Dwindows-conpty-package-dir=conpty-package)
          fi
          if [ -n "${{ matrix.target }}" ]; then
            build_args=(-Dtarget=${{ matrix.target }} "${build_args[@]}")
          fi
          for attempt in 1 2 3; do
            if zig build "${build_args[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Strip non-exported symbols
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for f in zig-out/bin/*-module${{ matrix.suffix }}; do
            strip -x "$f" 2>/dev/null || strip "$f" 2>/dev/null || true
          done

      - name: Package release artifact
        shell: bash
        run: |
          files=(
            dyn-loader-module${{ matrix.suffix }}
            ghostel-module${{ matrix.suffix }}
            ghostel-module.json
          )
          if [[ "${{ matrix.platform }}" == "x86_64-windows" ]]; then
            files+=(conpty.dll x64/OpenConsole.exe)
          elif [[ "${{ matrix.platform }}" == "aarch64-windows" ]]; then
            files+=(conpty.dll arm64/OpenConsole.exe)
          fi
          while IFS= read -r pdb; do
            files+=("${pdb#zig-out/bin/}")
          done < <(find zig-out/bin -type f -name '*.pdb' -print)
          tar -C zig-out/bin -cJf ghostel-module-${{ matrix.platform }}.tar.xz "${files[@]}"

      - name: Upload artifact to release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.prepare-release.outputs.tag }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: ghostel-module-${{ matrix.platform }}.tar.xz
          token: ${{ secrets.GITHUB_TOKEN }}
